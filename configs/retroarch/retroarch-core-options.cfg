# Retroid Pocket 5 - 2D Core Options & Low-Pass Audio Filters

# Genesis Plus GX (Model 1 Low-Pass Hardware Simulation)
genesis_plus_gx_audio_filter = "low-pass"
genesis_plus_gx_lowpass_range = "60"
genesis_plus_gx_ym2612 = "mame (ym2612)"
genesis_plus_gx_overscan = "disabled"
genesis_plus_gx_aspect_ratio = "auto"

# Snes9x
snes9x_audio_interpolation = "gaussian"
snes9x_aspect = "4:3"
snes9x_hires_blend = "merge"
snes9x_reduce_sprite_flicker = "disabled"

# Gambatte
gambatte_gb_colorization = "internal"
gambatte_gb_internal_palette = "Special 1"
gambatte_gbc_color_correction = "accurate"
gambatte_sound_resampling = "sinc"

# Mesen
mesen_palette = "Default"
mesen_aspect_ratio = "Auto"
mesen_hd_packs = "enabled"

# FBNeo
fbneo-sample-interpolation = "4-point 3rd order"
fbneo-fm-interpolation = "4-point 3rd order"
fbneo-vertical-mode = "disabled"

# mGBA
mgba_color_correction = "disabled"
mgba_audio_resampling = "sinc"
mgba_use_bios = "ON"
