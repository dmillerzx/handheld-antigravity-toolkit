# ====================================================================
# Retroid Pocket 5 - Ultra-Low-Latency 2D RetroArch Engine Configuration
# ====================================================================

# Video / Latency Pipeline
video_driver = "vulkan"
menu_driver = "ozone"
video_threaded = "false"
video_vsync = "true"
video_smooth = "false"
video_aspect_ratio_auto = "true"
video_max_swapchain_images = "2"
video_frame_delay_auto = "true"
video_frame_delay = "4"
video_shader_enable = "true"
auto_shaders_enable = "true"
auto_overrides_enable = "true"
auto_remaps_enable = "true"

# Input Polling & Latency
input_poll_type_behavior = "2"
run_ahead_enabled = "true"
run_ahead_frames = "1"
run_ahead_secondary_instance = "true"
run_ahead_hide_warnings = "true"

# Audio Subsystem
audio_driver = "opensles"
audio_latency = "48"
audio_sync = "true"
audio_rate_control = "true"
audio_max_timing_skew = "0.050000"
audio_resampler = "sinc"
audio_resampler_quality = "3"
audio_filter_dir = "/storage/EEEF-F762/RetroArch/filters/audio"

# Canonical SD Paths
system_directory = "/storage/EEEF-F762/bios"
savefile_directory = "/storage/EEEF-F762/RetroArch/saves"
savestate_directory = "/storage/EEEF-F762/RetroArch/states"
rgui_config_directory = "/storage/EEEF-F762/RetroArch/config"
input_remapping_directory = "/storage/EEEF-F762/RetroArch/config/remaps"
core_options_path = "/storage/EEEF-F762/RetroArch/config/retroarch-core-options.cfg"
video_shader_dir = "/storage/EEEF-F762/RetroArch/shaders"

# Hotkeys & Safeguards (Russ Standard)
quit_press_twice = "true"
pause_nonactive = "true"
save_state_auto_save = "true"
save_state_auto_load = "true"
rewind_enable = "true"
input_enable_hotkey_btn = "109"
input_menu_toggle_gamepad_combo = "2"
input_load_state_btn = "9"
input_save_state_btn = "10"
input_rewind_btn = "11"
input_hold_fast_forward_btn = "12"
